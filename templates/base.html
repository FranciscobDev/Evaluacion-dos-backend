{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catálogo de Películas{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Header & Nav -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-md navbar-dark backdrop-blur border-bottom border-secondary border-opacity-25" style="background-color: rgba(18, 17, 16, 0.95);">
            <div class="container">
                <a href="{% url 'FranciscoMauricio_APP:Inicio' %}" class="navbar-brand d-flex align-items-center gap-2 fw-bold">
                    <div class="brand-icon">
                        <i class="bi bi-camera-reels text-gold"></i>
                    </div>
                    <span class="brand-title text-white">frauri<span class="text-gold">Hub</span></span>
                </a>

                <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto mb-2 mb-md-0 gap-1 align-items-md-center">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold px-3" href="{% url 'FranciscoMauricio_APP:Inicio' %}">
                                <i class="bi bi-house-door me-1 text-gold"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted px-3 hover-text-white" href="{% url 'FranciscoMauricio_APP:Accion' %}">
                                Acción
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted px-3 hover-text-white" href="{% url 'FranciscoMauricio_APP:CienciaFiccion' %}">
                                Ciencia Ficción
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted px-3 hover-text-white" href="{% url 'FranciscoMauricio_APP:Comedia' %}">
                                Comedia
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted px-3 hover-text-white" href="{% url 'FranciscoMauricio_APP:Romance' %}">
                                Romance
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer-custom mt-auto py-4 border-top border-secondary border-opacity-25" style="background-color: #121110;">
        <div class="container">
            <div class="row align-items-center gy-3">
                <div class="col-md-6 text-center text-md-start">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2 mb-1">
                        <i class="bi bi-camera-reels text-gold"></i>
                        <span class="fw-bold text-white">frauriHub</span>
                    </div>
                    <p class="text-muted small mb-0">frauriHub &copy; 2026. Todos los derechos reservados.</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <div class="d-inline-flex gap-3">
                        <a href="{% url 'FranciscoMauricio_APP:Inicio' %}" class="text-muted text-decoration-none small hover-text-white">Inicio</a>
                        <a href="#ubicacion" class="text-muted text-decoration-none small hover-text-white">Ubicación</a>
                        <a href="#" class="text-gold text-decoration-none small fw-semibold"><i class="bi bi-arrow-up-circle me-1"></i>Subir</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
