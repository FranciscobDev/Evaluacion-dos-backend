{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Templates Project{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-dark text-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand text-danger fw-bold fs-3" href="{% url 'FranciscoMauricio_APP:Inicio' %}">🎥 Catálogo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'FranciscoMauricio_APP:Inicio' %}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'FranciscoMauricio_APP:Accion' %}">Acción</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'FranciscoMauricio_APP:CienciaFiccion' %}">Ciencia Ficción</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'FranciscoMauricio_APP:Comedia' %}">Comedia</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'FranciscoMauricio_APP:Romance' %}">Romance</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; Django Project Templates 2026</p>
    </footer>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
